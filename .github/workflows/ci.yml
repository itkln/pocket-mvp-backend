name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same entry point as `make test-integration`: PostgreSQL in a throwaway container,
      # every migration applied to a fresh schema per test, all packages tested.
      - name: Unit and integration tests
        run: ./scripts/test-integration.sh -count=1 ./...
